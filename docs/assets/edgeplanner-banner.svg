<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="EdgePlanner: agentless home-network attack planning">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111a33"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.5" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
      <animate attributeName="x1" values="0;-1;0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;2;1" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0.18"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1e2a4a" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="radar"><circle cx="900" cy="180" r="160"/></clipPath>
    <style>
      .t  { font-family: "JetBrains Mono", "Fira Code", Menlo, Consolas, monospace; }
      .s  { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .edge   { stroke: #2b3b66; stroke-width: 2; fill: none; }
      .attack { stroke: #f87171; stroke-width: 2.5; fill: none; stroke-dasharray: 6 10; animation: flow 1.2s linear infinite; }
      .lan    { stroke: #5eead4; stroke-width: 1.5; fill: none; stroke-dasharray: 3 9; opacity: .7; animation: flow 2.4s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -32; } }
      .node { animation: pop .6s cubic-bezier(.2,1.6,.4,1) both; transform-box: fill-box; transform-origin: center; }
      @keyframes pop { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
      .ping { fill: none; stroke: #5eead4; stroke-width: 2; transform-box: fill-box; transform-origin: center; animation: ping 2.4s ease-out infinite; }
      @keyframes ping { 0% { transform: scale(.6); opacity: .9; } 100% { transform: scale(2.4); opacity: 0; } }
      .vuln { animation: blink 1.6s ease-in-out infinite; }
      @keyframes blink { 50% { opacity: .25; } }
      .typed { overflow: hidden; clip-path: inset(0 100% 0 0); animation: type 1.4s steps(11) .3s forwards; }
      @keyframes type { to { clip-path: inset(0 0 0 0); } }
      .fade { opacity: 0; animation: fade .8s ease 1.6s forwards; }
      .fade2 { opacity: 0; animation: fade .8s ease 2.1s forwards; }
      @keyframes fade { to { opacity: 1; } }
      .cursor { animation: cur 1s steps(1) infinite; }
      @keyframes cur { 50% { opacity: 0; } }
      .radar { transform-origin: 900px 180px; animation: spin 6s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .lbl { font-size: 12px; fill: #94a3b8; }
    </style>
  </defs>

  <rect width="1200" height="360" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="18" fill="url(#grid)" opacity=".55"/>

  <!-- radar sweep behind the network -->
  <g clip-path="url(#radar)">
    <circle cx="900" cy="180" r="160" fill="url(#glow)"/>
    <path class="radar" d="M900 180 L1060 180 A160 160 0 0 0 1013 67 Z" fill="url(#sweep)"/>
  </g>
  <circle cx="900" cy="180" r="160" fill="none" stroke="#1e2a4a" stroke-dasharray="2 6"/>
  <circle cx="900" cy="180" r="100" fill="none" stroke="#1e2a4a" stroke-dasharray="2 6"/>

  <!-- title -->
  <g transform="translate(64 0)">
    <text x="0" y="96" class="t" font-size="15" fill="#5eead4" letter-spacing="3">$ python run.py discover</text>
    <g class="typed">
      <text x="-4" y="180" class="s" font-size="84" font-weight="800" fill="url(#title)" letter-spacing="-2">EdgePlanner</text>
    </g>
    <rect class="cursor" x="500" y="118" width="6" height="72" fill="#5eead4"/>
    <text x="0" y="222" class="s fade" font-size="22" fill="#cbd5e1">See your home network the way an attacker does,</text>
    <text x="0" y="252" class="s fade" font-size="22" fill="#cbd5e1">then learn how to shut every path down.</text>
    <g class="fade2 t" font-size="13">
      <rect x="0"   y="282" width="96"  height="28" rx="14" fill="#0f2a2a" stroke="#5eead4"/>
      <text x="48"  y="301" text-anchor="middle" fill="#5eead4">agentless</text>
      <rect x="108" y="282" width="110" height="28" rx="14" fill="#13213f" stroke="#60a5fa"/>
      <text x="163" y="301" text-anchor="middle" fill="#60a5fa">PDDL plans</text>
      <rect x="230" y="282" width="132" height="28" rx="14" fill="#221a3f" stroke="#a78bfa"/>
      <text x="296" y="301" text-anchor="middle" fill="#a78bfa">Raspberry Pi 3</text>
    </g>
  </g>

  <!-- edges -->
  <path class="edge" d="M780 70 L900 180"/>
  <path class="attack" d="M780 70 L900 180"/>
  <path class="edge" d="M900 180 L1010 90"/>
  <path class="edge" d="M900 180 L1040 200"/>
  <path class="edge" d="M900 180 L980 290"/>
  <path class="edge" d="M900 180 L810 280"/>
  <path class="attack" d="M900 180 L1010 90" style="animation-delay:.4s"/>
  <path class="lan" d="M900 180 L1040 200"/>
  <path class="lan" d="M900 180 L980 290"/>
  <path class="lan" d="M900 180 L810 280"/>

  <!-- attacker n0 -->
  <g class="node" style="animation-delay:.2s">
    <circle cx="780" cy="70" r="20" fill="#2a0f14" stroke="#f87171" stroke-width="2"/>
    <text x="780" y="75" text-anchor="middle" class="t" font-size="13" font-weight="700" fill="#f87171">n0</text>
  </g>
  <text x="742" y="48" class="t lbl">attacker</text>

  <!-- router -->
  <circle class="ping" cx="900" cy="180" r="26"/>
  <g class="node" style="animation-delay:.5s">
    <circle cx="900" cy="180" r="26" fill="#0f2a2a" stroke="#5eead4" stroke-width="2.5"/>
    <path d="M888 186 h24 v8 h-24z M893 186 l-4 -12 M907 186 l4 -12" stroke="#5eead4" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
  <text x="900" y="226" text-anchor="middle" class="t lbl">router</text>

  <!-- camera (vulnerable, on the attack path) -->
  <g class="node" style="animation-delay:.8s">
    <circle cx="1010" cy="90" r="20" fill="#2a0f14" stroke="#f87171" stroke-width="2"/>
    <rect x="1000" y="83" width="16" height="12" rx="2" fill="none" stroke="#f87171" stroke-width="2"/>
    <path d="M1016 86 l6 -3 v12 l-6 -3" fill="none" stroke="#f87171" stroke-width="2" stroke-linejoin="round"/>
  </g>
  <g class="vuln"><circle cx="1026" cy="74" r="7" fill="#f87171"/><text x="1026" y="78" text-anchor="middle" class="t" font-size="10" font-weight="700" fill="#0b1020">!</text></g>
  <text x="1036" y="118" class="t lbl">camera · CVE</text>

  <!-- phone -->
  <g class="node" style="animation-delay:1s">
    <circle cx="1040" cy="200" r="18" fill="#13213f" stroke="#60a5fa" stroke-width="2"/>
    <rect x="1034" y="190" width="12" height="20" rx="2.5" fill="none" stroke="#60a5fa" stroke-width="2"/>
  </g>
  <text x="1066" y="205" class="t lbl">phone</text>

  <!-- speaker -->
  <g class="node" style="animation-delay:1.15s">
    <circle cx="980" cy="290" r="18" fill="#13213f" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="980" cy="290" r="7" fill="none" stroke="#60a5fa" stroke-width="2"/>
  </g>
  <text x="1004" y="295" class="t lbl">speaker</text>

  <!-- pi / laptop -->
  <g class="node" style="animation-delay:1.3s">
    <circle cx="810" cy="280" r="18" fill="#221a3f" stroke="#a78bfa" stroke-width="2"/>
    <rect x="801" y="272" width="18" height="12" rx="2" fill="none" stroke="#a78bfa" stroke-width="2"/>
    <path d="M797 289 h26" stroke="#a78bfa" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="728" y="314" class="t lbl">EdgePlanner box</text>
</svg>
