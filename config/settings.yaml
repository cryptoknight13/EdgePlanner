# Pipeline settings (phases 1+).
# Scope is detected automatically: the interface with the default route and the network it is on.
# Only RFC1918 networks of /16 or smaller are ever scanned. To pin them instead, replace `auto`,
# e.g.  interface: eth0   subnets: [192.168.1.0/24]
interface: auto
subnets: auto
attacker_ip: 0.0.0.0          # n0, the external attacker in the iEXAM model
passive_window_seconds: 45    # discovery listens this long while it sweeps and browses

web:
  # Names the page answers to besides IPs and localhost (any other Host header is refused: DNS rebinding).
  # scripts/install_box.sh serves them on the LAN: *.local by mDNS, the rest by the box's own DNS.
  hostnames: [edgeplanner.local]
  port: 80                      # the box's page service (scripts/install_box.sh); login in .env (EDGEPLANNER_USER/PASSWORD)

box:                            # the EdgePlanner box itself (the Pi), set up by scripts/install_box.sh
  dns_servers: [208.67.222.222, 208.67.220.220]   # OpenDNS: upstream of the box's own resolver
  setup_wifi:                   # started when the box has no network after boot; password in .env (SETUP_WIFI_PASSWORD)
    ssid: EdgePlanner-Setup
    subnet: 10.42.0.0/24        # the box takes the first address; laptops get the rest
    wait_seconds: 120           # how long after boot to wait for a cable or a known Wi-Fi

oui_file: data/oui.csv
oui_url: https://standards-oui.ieee.org/oui/oui.csv

gather_top_ports: 1000        # nmap --top-ports for phase 2

scan:
  exclude_products: [linux_kernel]   # OS kernel CPEs match thousands of local CVEs; skipped and recorded
  nuclei_mode: fast                  # fast | full | off. Detection only; intrusive/dos/fuzz/brute excluded

export:                          # phase 6, iEXAM input files
  include_weak: false            # CVEs NVD lists without a version
  min_cvss: 0
  require_public_exploit: false
  lateral_edges: false           # true: compromised devices can attack each other directly

plan:                            # phase 7, iEXAM planners
  k: 3                           # top-K attack plans per goal (ForbidIterative)

llm:                             # phase 8c: every LLM step (CVE explanations, plan explanations, fix guides)
  provider: api                  # api | local. local = small model via llama.cpp on 127.0.0.1; scan data stays here
  api:                           # hosted, OpenAI-compatible; key in .env (NVIDIA_API_KEY). LLM_BASE_URL / LLM_MODEL in .env override
    base_url: https://integrate.api.nvidia.com/v1
    model: nvidia/nemotron-3-ultra-550b-a55b
    budget: {context: 32768, max_tokens: 4096, page_chars: 4000, pages_total_chars: 32000, cve_batch: 8, timeout: 120}
  local:
    server: tools/llama.cpp/build/bin/llama-server   # built by scripts/fetch_llama.sh
    model: qwen3-0.6b            # key into models below
    port: 8091
    threads: 4
    # One request at a time: 1 slot, no prompt cache, q8_0 KV cache (needs flash attention), no weight repack
    # (a second copy of the weights). Measured on Kali with qwen3-0.6b: 335 MB anon + 386 MB mapped model,
    # against 911 + 384 MB with llama-server's defaults.
    server_args: [-np, "1", -cram, "0", -fa, "on", -ctk, q8_0, -ctv, q8_0, -nr]
    budget: {context: 4096, max_tokens: 512, page_chars: 1500, pages_total_chars: 6000, cve_batch: 2, timeout: 600}
  models:                        # GGUF files fetched by scripts/fetch_model.sh <key>; url + sha256 pinned
    qwen3-0.6b:   {file: models/qwen3-0.6b.gguf, no_think: true,
                   url: "https://huggingface.co/unsloth/Qwen3-0.6B-GGUF/resolve/50968a4468ef4233ed78cd7c3de230dd1d61a56b/Qwen3-0.6B-Q4_K_M.gguf",
                   sha256: ac2d97712095a558e31573f62f466a3f9d93990898b0ec79d7c974c1780d524a}   # Q4_K_M, 397 MB
    qwen2.5-0.5b: {file: models/qwen2.5-0.5b.gguf,
                   url: "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/9217f5db79a29953eb74d5343926648285ec7e67/qwen2.5-0.5b-instruct-q4_k_m.gguf",
                   sha256: 74a4da8c9fdbcd15bd1f6d01d621410d31c6fc00986f5eb687824e7b93d7a9db}   # Q4_K_M, 491 MB
    gemma3-270m:  {file: models/gemma3-270m.gguf,
                   url: "https://huggingface.co/unsloth/gemma-3-270m-it-GGUF/resolve/c90975dbd40c0c7b275fefaae758c3415c906238/gemma-3-270m-it-Q4_K_M.gguf",
                   sha256: b1baabd6b729e4041822220d3e648e00d99cac5df86b10dffb77bcccf0688e39}   # Q4_K_M, 253 MB
    smollm2-360m: {file: models/smollm2-360m.gguf,
